# Recording rules for the per-user views. increase() over a counter handles the
# resets a redeploy would cause, so these stay correct across restarts.
groups:
  - name: ec2cp-cost
    interval: 1m
    rules:
      # Current burn rate, one series per user.
      - record: ec2cp:hourly_usd:by_owner
        expr: sum by (owner) (ec2cp_instance_hourly_usd)

      # Spend over the trailing hour / day / week, per user.
      - record: ec2cp:cost_usd_1h:by_owner
        expr: sum by (owner) (increase(ec2cp_instance_cost_usd_total[1h]))
      - record: ec2cp:cost_usd_1d:by_owner
        expr: sum by (owner) (increase(ec2cp_instance_cost_usd_total[1d]))
      - record: ec2cp:cost_usd_7d:by_owner
        expr: sum by (owner) (increase(ec2cp_instance_cost_usd_total[7d]))

      # Same, per sandbox — for "which box is burning the money". Grouping by
      # `instance` here would collapse every box into the scrape target.
      - record: ec2cp:cost_usd_1d:by_sandbox
        expr: sum by (sandbox, owner) (increase(ec2cp_instance_cost_usd_total[1d]))

      # Running hours per user per day.
      - record: ec2cp:running_hours_1d:by_owner
        expr: sum by (owner) (increase(ec2cp_instance_running_seconds_total[1d])) / 3600
