# Local stack: builds from source, same services as production.
# Ports (host network): 2720 app, 2725 Prometheus, 2726 Grafana.
services:
  ec2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    network_mode: host
    # ports:
    #   - 2720:2720

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=395d
      - --web.listen-address=127.0.0.1:2725
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: always
    network_mode: host

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "2726"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # No sub-path locally: reach it straight on http://127.0.0.1:2726.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    network_mode: host

volumes:
  prometheus-data: {}
  grafana-data: {}
